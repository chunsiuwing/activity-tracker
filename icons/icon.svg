<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ActionLog">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#12233f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#22d3ee" stroke-opacity=".28" stroke-width="6"/>

  <!-- camera lens -->
  <circle cx="368" cy="152" r="58" fill="none" stroke="#4f8cff" stroke-width="16" stroke-opacity=".55"/>
  <circle cx="368" cy="152" r="22" fill="#22d3ee" fill-opacity=".85"/>

  <!-- activity waveform -->
  <path d="M78 300 H148 L188 176 L244 420 L286 250 L322 330 H434"
        fill="none" stroke="url(#wave)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- rec dot -->
  <circle cx="140" cy="152" r="26" fill="#f87171"/>
</svg>
